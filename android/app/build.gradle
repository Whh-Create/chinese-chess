plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.chinesechess'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.chinesechess"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            // 用 debug 签名，保证 assembleRelease 出的包也能直接安装
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

/* ------------------------------------------------------------------
 * 网页资源单一来源：仓库根目录的 index.html / style.css / script.js
 * 构建前自动复制到 assets/www，仓库里不需要维护第二份副本
 * ------------------------------------------------------------------ */
def repoRoot = rootProject.projectDir.parentFile

tasks.register('syncWebAssets', Copy) {
    from(repoRoot) {
        include 'index.html'
        include 'style.css'
        include 'script.js'
        include 'manifest.webmanifest'
        include 'sw.js'
        include 'icons/**'
    }
    into 'src/main/assets/www'
}

afterEvaluate {
    tasks.named('preBuild').configure {
        dependsOn 'syncWebAssets'
    }
}
