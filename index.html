<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#f0e4cd" />
<meta name="description" content="中国象棋双人对战 - 纯前端实现，支持走法校验、将军判定、悔棋与棋谱记录" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="中国象棋" />
<meta name="mobile-web-app-capable" content="yes" />
<title>中国象棋 · 双人对战</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='29' fill='%23f7ebd0' stroke='%23b03a2e' stroke-width='3'/%3E%3Ccircle cx='32' cy='32' r='23' fill='none' stroke='%23b03a2e' stroke-width='1.5' opacity='.6'/%3E%3Ctext x='32' y='43' font-size='30' text-anchor='middle' fill='%23b03a2e' font-family='serif'%3E%E5%B8%85%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="app">

  <header class="topbar">
    <h1>中国象棋</h1>
    <p class="subtitle">双人同屏对战 · 红先黑后</p>
  </header>

  <main class="main">

    <section class="board-area">
      <div class="player-bar black" id="blackBar">
        <span class="dot"></span>
        <span class="pname">黑方</span>
        <span class="ptag" id="blackTag">等待中</span>
      </div>

      <div class="stage" id="stage">
        <div class="board-wrap" id="boardWrap">
          <canvas id="boardCanvas"></canvas>
          <div class="layer" id="hintsLayer"></div>
          <div class="layer pieces-layer" id="piecesLayer"></div>
        </div>
      </div>

      <div class="player-bar red" id="redBar">
        <span class="dot"></span>
        <span class="pname">红方</span>
        <span class="ptag" id="redTag">行棋中</span>
      </div>
    </section>

    <aside class="sidebar">

      <div class="panel status-panel">
        <div class="status-main" id="statusMain">红方先行</div>
        <div class="status-sub" id="statusSub">点击棋子查看可走位置</div>
      </div>

      <div class="panel actions">
        <button class="btn" id="btnUndo" type="button">悔 棋</button>
        <button class="btn" id="btnRestart" type="button">重 开</button>
        <button class="btn ghost" id="btnSound" type="button">音效：开</button>
      </div>

      <div class="panel log-panel">
        <div class="panel-title">
          <span>棋谱记录</span>
          <span class="count" id="moveCount">0 手</span>
        </div>
        <div class="log-list" id="logList">
          <div class="log-empty">尚未落子</div>
        </div>
      </div>

    </aside>

  </main>
</div>

<div class="overlay hidden" id="overlay">
  <div class="dialog">
    <div class="dialog-icon" id="dialogIcon">🏆</div>
    <h2 id="resultTitle">红方胜</h2>
    <p id="resultDesc">黑方被将死</p>
    <div class="dialog-actions">
      <button class="btn primary" id="btnPlayAgain" type="button">再来一局</button>
      <button class="btn ghost" id="btnCloseDialog" type="button">看看棋盘</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
<script>
  /* 离线缓存：仅在 http(s) 下注册，本地双击打开时自动跳过 */
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
</script>
</body>
</html>
